<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0E1116" />
    <meta name="color-scheme" content="dark light" />
    <script>
      (function () {
        var t;
        try { t = localStorage.getItem('buffet_theme') } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme = t;
        if (t === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f4f5f7');
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" href="/buffet/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/buffet/icons/apple-touch-icon.png" />
    <title>Buffet Kaluan</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
